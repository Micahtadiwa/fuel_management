spring.application.name=fuel_management

# Loads real local secrets (DB password, etc.) from a gitignored file if present.
# Create src/main/resources/application-local.properties for local development.
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/transport}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate manages the schema: creates/updates tables and columns from @Entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.inactivity-timeout=${JWT_INACTIVITY_TIMEOUT:1800000}

# CORS allowed origins (comma-separated). Override in production with your Vercel domain.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,https://fuel-front-eight.vercel.app,https://*.vercel.app}